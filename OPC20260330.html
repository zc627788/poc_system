                    svgRef.current.setAttribute('viewBox', tempNode.getAttribute('viewBox') || '0 0 24 24');
                }
            }, [name]);

            return (
                <svg
                    ref={svgRef}
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    className={className}
                    stroke={color}
                    strokeWidth={strokeWidth}

                      <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 transition-all duration-1000 pointer-events-none" />
                      <div className="absolute bottom-0 left-0 w-48 h-48 bg-white/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 transition-all duration-1000 pointer-events-none" />
                      
                      {/* 高度占位锚点 (不可见)，以确保轮播容器高度不塌陷 */}
                      <div className="md:w-2/3 opacity-0 pointer-events-none">
                         <span className="inline-block text-xs px-3 py-1 mb-4">Placeholder</span>
                         <h3 className="text-3xl md:text-[32px] font-bold mb-4">Placeholder</h3>
                         <p className="text-base md:text-[15px] leading-relaxed max-w-2xl mb-8">
                           全面覆盖数字经济、人工智能、智慧物流、全空间无人体系等多元产业领域，提供最前沿的场景开放清单，助力企业快速精准寻找市场契合点。
                         </p>
                         <div className="px-8 py-3 text-sm">Btn</div>
                      </div>

                      {/* 轮播主体内容 */}
                      <div className="absolute inset-0 p-8 md:p-12 z-10 flex items-center">
                        <div className="relative w-full h-full flex items-center">
                          {scenarioSlides.map((slide, i) => (
                             <div 
                                key={i} 
                                className={`absolute w-full transition-all duration-700 ease-in-out ${
                                  i === scenarioSlide ? "opacity-100 translate-x-0 z-10" : "opacity-0 translate-x-8 pointer-events-none -z-10"
                                }`}
                             >
                                <div className="md:w-2/3">
                                  <span className="inline-block bg-white/10 text-[13px] px-3 py-1 rounded mb-4 backdrop-blur-sm border border-white/20 text-blue-50 tracking-wide shadow-sm">
                                    {slide.subtitle}
                                  </span>
                                  <h3 className="text-2xl md:text-[34px] font-bold mb-4 tracking-wide">{slide.title}</h3>
                                  <p className="text-white/80 mb-8 text-[14px] md:text-[15px] leading-relaxed max-w-2xl font-medium">
                                    {slide.desc}
                                  </p>
                                  {/* 【已修改】：将 a 标签改为了 div，以防止嵌套的超链接冲突，并增加了由外层 group-hover 触发的悬浮动效 */}
                                  <div
                                    className="inline-flex items-center justify-center bg-[#0052d9] text-white px-8 py-3.5 rounded-full text-[14px] font-bold group-hover:bg-blue-500 group-hover:shadow-lg group-hover:shadow-blue-500/30 transition-all gap-2"
                                  >
                                    {slide.btnText} <Icon name="ArrowRight" size={14}/>
                                  </div>
                                </div>
                             </div>
                          ))}
                        </div>
                      </div>

                      {/* 轮播指示器 */}
                      {/* 【已修改】：添加了 e.stopPropagation() 防止点击小圆点时触发卡片跳转 */}
                      <div className="absolute bottom-8 right-8 md:right-12 flex gap-2 z-20">
                        {scenarioSlides.map((_, i) => (
                          <button
                            key={i}
                            onClick={(e) => { e.stopPropagation(); setScenarioSlide(i); }}
                            className={`h-1.5 rounded-full transition-all duration-300 ${
                              i === scenarioSlide ? "w-8 bg-white" : "w-4 bg-white/30 hover:bg-white/60"
                            }`}
                          />
                        ))}
                      </div>
                    </div>
                  </section>

                  <footer className="bg-gray-50 border-t border-gray-200 py-8">
                    <div className="container mx-auto px-4 text-center text-gray-500 text-sm">
                      <p>© 2026 厦门 OPC 社区. All rights reserved.</p>
                    </div>
                  </footer>
                </div>
              )}

              {/* 其余路由页面 */}
              {currentPage === 'news' && <NewsPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'community' && <CommunityPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'services' && <ServicesPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'opc_registration' && <OpcRegistrationPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'financing' && <FinancingPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'housing' && <HousingPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'marketplace' && <MarketplacePage setCurrentPage={setCurrentPage} />}
              {currentPage === 'api_market' && <ApiMarketPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'mcp_market' && <McpMarketPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'feedback' && <FeedbackPage setCurrentPage={setCurrentPage} />}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
