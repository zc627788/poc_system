services:
  mysql:
    image: mysql:8.4
    container_name: opc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opc_portal}
      MYSQL_USER: ${MYSQL_USER:-opc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opc123456}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: opc-api
    restart: unless-stopped
    environment:
      APP_NAME: OPC Portal API
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-me}
      JWT_ALGORITHM: HS256
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-opc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opc123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opc_portal}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE_URL: http://api:8000/api
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: opc-web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_BASE_URL: http://api:8000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ../../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: opc-admin
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: opc-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
